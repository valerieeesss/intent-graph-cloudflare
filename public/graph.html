<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page overlap graph</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#192332;--muted:#677384;--quiet:#919aa7;--line:#e1e6ec;--red:#cc1833;--blue:#4385c0;--green:#338674;--gold:#b78021;--purple:#8970a8;--mono:'IBM Plex Mono',monospace;--sans:'DM Sans',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}header{padding:17px 20px 14px;background:var(--paper);border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0;font-weight:600;letter-spacing:-.04em}h1 i{color:var(--red);font-style:normal}.sub{font-size:11px;color:var(--muted);margin:4px 0 0}.stats{display:flex;gap:20px;margin-top:13px}.stat{display:flex;flex-direction:column;gap:2px}.stat b{font:500 17px var(--mono)}.stat span{font-size:8px;text-transform:uppercase;letter-spacing:.09em;color:var(--quiet)}main{height:calc(100vh - 110px);min-height:510px;position:relative}#graph{width:100%;height:100%;cursor:grab}#graph:active{cursor:grabbing}.link{stroke:#b9c2cd;stroke-width:1.2;stroke-opacity:.62}.link.strong{stroke:var(--red);stroke-opacity:.48}.link.dim{stroke-opacity:.045}.node{cursor:pointer}.node.dim{opacity:.12}.node circle{stroke:white;stroke-width:2}.node text{font:10px var(--mono);fill:#506071;paint-order:stroke;stroke:var(--bg);stroke-width:3px;pointer-events:none}.node.hot text{fill:var(--ink);font-weight:500}.node.hot circle{stroke:var(--red);stroke-width:2.5}#panel{position:absolute;right:13px;top:13px;width:310px;max-width:calc(100% - 26px);max-height:calc(100% - 26px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 4px 22px #26364a14;padding:15px;font-size:11px;line-height:1.5}.hint{color:var(--muted);margin:0}.p-title{font-weight:600;font-size:14px;line-height:1.35;overflow-wrap:anywhere}.p-url{font:9px/1.5 var(--mono);color:var(--quiet);overflow-wrap:anywhere;margin:6px 0 11px}.row{display:flex;justify-content:space-between;gap:9px;border-top:1px solid #edf0f3;padding:6px 0}.row span:first-child{color:var(--quiet)}.row span:last-child{text-align:right;font-weight:500}.section-title{font-size:9px;font-weight:600;color:var(--quiet);letter-spacing:.1em;text-transform:uppercase;margin:13px 0 6px}.note{background:#f5f6f8;border-left:2px solid var(--red);border-radius:3px;padding:8px;margin-top:9px;color:#526070;overflow-wrap:anywhere}.intent-note{background:#faf6ed;border-left-color:var(--gold)}.match{border-top:1px solid #edf0f3;padding:9px 0}.match-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:7px}.score{color:var(--red);font:500 11px var(--mono);white-space:nowrap}.terms{font:9px var(--mono);color:#6c7887;margin-top:4px}.evidence{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45}.evidence b{color:#435263}.legend{position:absolute;left:13px;bottom:13px;display:flex;gap:10px;flex-wrap:wrap;background:#ffffffed;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:9px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.toolbar{position:absolute;left:13px;top:13px;display:flex;gap:5px}.toolbar button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 9px;color:var(--muted);font:10px var(--sans);cursor:pointer}.toolbar button.active{background:var(--ink);color:white;border-color:var(--ink)}.empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);max-width:290px;font-size:12px;line-height:1.6}.small{color:var(--quiet);font-size:9px}@media(max-width:650px){header{padding:13px}.stats{gap:12px}.stat b{font-size:15px}.stat span{font-size:7px}main{height:auto;min-height:0;display:flex;flex-direction:column}#graph{height:470px;order:1}.toolbar{position:static;order:0;padding:10px 12px 0;flex-wrap:wrap}#panel{position:static;order:2;width:auto;max-width:none;max-height:none;margin:0 12px 12px}.legend{left:12px;bottom:auto;top:405px;max-width:calc(100% - 24px)}}
.gsc-note{padding:9px 10px;margin:9px 0;background:#f0f6f4;border-left:2px solid #38856f;border-radius:3px;font-size:11px;line-height:1.5;color:#314f46}.gsc-note.muted{background:#f5f6f8;border-color:#b8c0ca;color:#6d7886}.gsc-note small{display:block;font-size:9px;color:#697a73;margin-top:5px}.gsc-examples{margin:6px 0}.gsc-examples>div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid #dce8e4}.gsc-examples small{margin:0;text-align:right;white-space:nowrap}@media(max-width:700px){.gsc-examples>div{display:block}.gsc-examples small{text-align:left;white-space:normal}}</style></head><body><header><h1>Page overlap — <i>evidence graph</i></h1><p class="sub" id="subtitle">Page content analysis</p><div class="stats" id="stats"></div></header><main><svg id="graph"></svg><div class="toolbar"><button id="all" class="active">All pages</button><button id="linked">With overlaps</button><button id="intent">Intent conflicts</button><button id="labels">Hide labels</button></div><div id="panel"><p class="hint">Select a page to inspect its intent, overlap matches, and evidence from the source text. Drag to reposition; scroll to zoom.</p></div><div class="legend" id="legend"></div><div class="empty" id="empty" hidden>No pages crossed this match threshold. Lower the threshold or open the analysis again.</div></main><script>window.GRAPH_DATA=/*__DATA__*/null;</script><script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script><script>
const data=window.GRAPH_DATA;const colors=['#4385c0','#338674','#b78021','#8970a8','#c66b56','#548894','#98667a','#7d8a4d'];const color=d=>colors[(d.cluster||d.id)%colors.length];const nodes=data.nodes,links=data.links;const $=s=>document.querySelector(s);$('#subtitle').textContent=`${data.created_at} · Similarity: ${data.similarity_method} · Intent and role analysis: ${data.intent_method} · Entity: ${data.entity_method} · Search evidence: ${data.search_evidence?.status||'not connected'} · Match cutoff ${data.threshold}%`;
const stats=[['Pages',nodes.length],['Overlaps',links.length],['Strong matches',links.filter(x=>x.risk==='High').length],['Clusters',data.clusters.length]];$('#stats').innerHTML=stats.map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');const types=[...new Set(nodes.map(n=>n.intent))];$('#legend').innerHTML=types.map((t,i)=>`<span><i class="dot" style="background:${colors[i%colors.length]}"></i>${esc(t)}</span>`).join('')+'<span><i class="dot" style="background:var(--red)"></i>Selected page</span>';
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const svg=d3.select('#graph');let width,height;const root=svg.append('g'),gl=root.append('g'),gn=root.append('g');svg.call(d3.zoom().scaleExtent([.3,4]).on('zoom',e=>root.attr('transform',e.transform)));
const simulation=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(d=>Math.max(65,150-d.similarity*.8)).strength(.55)).force('charge',d3.forceManyBody().strength(-350)).force('collide',d3.forceCollide().radius(d=>9+Math.sqrt(links.filter(l=>l.source.id===d.id||l.target.id===d.id).length)*4+12)).force('center',d3.forceCenter(0,0)).force('x',d3.forceX(d=>((d.cluster||d.id)%4-1.5)*130).strength(.09)).force('y',d3.forceY(d=>(Math.floor((d.cluster||d.id)/4)-1.5)*100).strength(.08));
const link=gl.selectAll('line').data(links).join('line').attr('class',d=>'link'+(d.risk==='High'?' strong':''));const node=gn.selectAll('g').data(nodes).join('g').attr('class','node').call(d3.drag().on('start',(e,d)=>{if(!e.active)simulation.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)simulation.alphaTarget(0);d.fx=null;d.fy=null}));node.append('circle').attr('r',d=>7+Math.sqrt(links.filter(l=>l.source.id===d.id||l.target.id===d.id).length)*2.6).attr('fill',d=>color(d));const labels=node.append('text').attr('dy',d=>-11-Math.sqrt(links.filter(l=>l.source.id===d.id||l.target.id===d.id).length)*2.6).attr('text-anchor','middle').text(d=>d.title.length>27?d.title.slice(0,25)+'…':d.title);simulation.on('tick',()=>{link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`)});function resize(){const box=$('#graph').getBoundingClientRect();width=box.width;height=box.height;svg.attr('viewBox',`${-width/2} ${-height/2} ${width} ${height}`);simulation.force('center',d3.forceCenter(0,0)).alpha(.4).restart()}window.addEventListener('resize',resize);resize();
let active=null,mode='all';function matchesFor(d){return links.filter(l=>l.source.id===d.id||l.target.id===d.id).sort((a,b)=>b.similarity-a.similarity)}function highlight(d){active=d;const keep=new Set(d?[d.id,...matchesFor(d).map(l=>l.source.id===d.id?l.target.id:l.source.id)]:nodes.map(n=>n.id));node.classed('dim',n=>!keep.has(n.id)).classed('hot',n=>!!d&&keep.has(n.id));link.classed('dim',l=>!!d&&l.source.id!==d.id&&l.target.id!==d.id)}function describe(d){highlight(d);const matched=matchesFor(d);const searchMatched=(data.search_overlaps||[]).filter(x=>x.source===d.id||x.target===d.id);const role=`<div class="row"><span>Expected site role</span><span>${esc(d.expected_role||'unclear')}${d.expected_role_confidence?` · ${Math.round(d.expected_role_confidence*100)}%`:''}</span></div><div class="row"><span>Role fulfilment</span><span>${esc(d.role_fit||'unclear')}</span></div><div class="row"><span>Role depth</span><span>${d.depth_score==null?'—':`${esc(d.depth_score)}/100`}</span></div><div class="note intent-note">From ${esc(d.role_source||'URL slug')}: ${esc(d.expected_role_evidence||'No role evidence returned.')}${d.role_evidence?`<br><br>Content assessment: ${esc(d.role_evidence)}`:''}</div>`;const salience=d.closest_entity_salience==null?'':` · ${Math.round(d.closest_entity_salience*1000)/10}% salience`;$('#panel').innerHTML=`<div class="p-title">${esc(d.title)}</div><div class="p-url">${esc(d.url)}</div><div class="row"><span>Repeated same-site text removed</span><span>${d.template_chars_removed?`${Number(d.template_chars_removed).toLocaleString()} chars`:'None detected'}</span></div><div class="row"><span>Current visitor intent</span><span>${esc(d.intent)} · ${Math.round(d.intent_confidence*100)}%</span></div>${role}${d.gsc_top_query?`<div class="row"><span>Top GSC query</span><span>${esc(d.gsc_top_query)}</span></div><div class="row"><span>Ahrefs volume (AU)</span><span>${d.ahrefs_volume?.volume==null?'Unavailable':Number(d.ahrefs_volume.volume).toLocaleString()}</span></div>`:''}<div class="row"><span>Closest entity</span><span>${esc(d.closest_entity||'Unavailable')}${salience}</span></div><div class="small">${esc(d.closest_entity_type||'')} ${esc(d.entity_method||'')}</div><div class="row"><span>Intent method</span><span>${esc(d.intent_source)}</span></div><div class="row"><span>Overlap matches</span><span>${matched.length}</span></div>${d.search_console?`<div class="row"><span>Search clicks / impressions</span><span>${d.search_console.clicks} / ${d.search_console.impressions}</span></div><div class="row"><span>Search queries returned</span><span>${d.search_console.query_count}</span></div>`:''}${d.intent_evidence?`<div class="note">Current intent evidence: “${esc(d.intent_evidence)}”</div>`:''}<div class="section-title">Page content sample</div><div class="evidence">${esc(d.text_excerpt)}</div><div class="section-title">Google Search Console query overlap</div>${searchMatched.length?searchMatched.map(x=>{const other=nodes.find(n=>n.id===(x.source===d.id?x.target:x.source));return `<div class="match"><div class="match-head"><span>${esc(other.title)}</span><span>${x.shared_query_count} shared queries</span></div><div class="terms">${x.shared_impressions} shared impressions · ${x.shared_clicks} shared clicks</div>${x.shared_queries.map(q=>`<div class="evidence"><b>${esc(q.query)}</b><br>${q.a_impressions} / ${q.b_impressions} impressions · positions ${q.a_position} / ${q.b_position}</div>`).join('')}<div class="small">Possible search overlap; review query performance and page purpose before calling this cannibalisation.</div></div>`}).join(''):'<p class="hint">No shared queries found for this page pair set, or Google Search Console data was unavailable.</p>'}<div class="section-title">Matched pages and evidence</div>${matched.length?matched.map(l=>{const other=nodes.find(n=>n.id===(l.source.id===d.id?l.target.id:l.source.id));const own=l.source.id===d.id?l.source_evidence:l.target_evidence;const theirs=l.source.id===d.id?l.target_evidence:l.source_evidence;return `<div class="match"><div class="match-head"><span>${esc(other.title)}</span><span class="score">${l.similarity}%</span></div><div class="terms">Shared terms: ${esc(l.shared_topics.join(' · ')||'—')} · ${l.same_intent?'same observed intent':'different observed intent'}</div>${l.search_evidence?`<div class="gsc-note"><b>Search Console overlap:</b> ${l.search_evidence.shared_query_count} shared queries · ${l.search_evidence.shared_impressions} shared impressions · ${l.search_evidence.shared_clicks} shared clicks${l.search_evidence.shared_queries.length?`<div class="gsc-examples">${l.search_evidence.shared_queries.map(q=>`<div><span>${esc(q.query)}</span><small>${q.a_impressions} / ${q.b_impressions} impressions · positions ${q.a_position} / ${q.b_position}</small></div>`).join('')}</div>`:''}<small>Shared impressions use the lower page total for each query. This is evidence of search overlap, not proof of cannibalisation.</small></div>`:`<div class="gsc-note muted">No Google Search Console query data available for this pair.</div>`}<div class="evidence"><b>This page:</b> “${esc(own)}”</div><div class="evidence"><b>Matched page:</b> “${esc(theirs)}”</div></div>`}).join(''):'<p class="hint">No pages met the selected match cutoff.</p>'}`}

node.on('click',(e,d)=>{e.stopPropagation();describe(d)}).on('mouseenter',(e,d)=>{if(!active)describe(d)}).on('mouseleave',()=>{if(!active){highlight(null);$('#panel').innerHTML='<p class="hint">Select a page to inspect its intent, overlap matches, and evidence from the source text. Drag to reposition; scroll to zoom.</p>'}});svg.on('click',()=>{active=null;highlight(null);$('#panel').innerHTML='<p class="hint">Select a page to inspect its intent, overlap matches, and evidence from the source text. Drag to reposition; scroll to zoom.</p>'});
function filter(next){mode=next;document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));$('#'+next).classList.add('active');const visibleLinks=links.filter(l=>next==='all'||(next==='linked')||(next==='intent'&&l.same_intent===false));const visibleNodes=new Set(visibleLinks.flatMap(l=>[l.source.id,l.target.id]));node.style('display',n=>next==='all'||visibleNodes.has(n.id)?null:'none');link.style('display',l=>visibleLinks.includes(l)?null:'none');$('#empty').hidden=!(next!=='all'&&visibleLinks.length===0);active=null;highlight(null);$('#panel').innerHTML='<p class="hint">Select a page to inspect its intent, overlap matches, and evidence from the source text. Drag to reposition; scroll to zoom.</p>';simulation.alpha(.35).restart()}
$('#all').onclick=()=>filter('all');$('#linked').onclick=()=>filter('linked');$('#intent').onclick=()=>filter('intent');$('#labels').onclick=e=>{const shown=labels.style('display')!=='none';labels.style('display',shown?'none':null);e.currentTarget.textContent=shown?'Show labels':'Hide labels'};if(!links.length)$('#empty').hidden=false;
</script></body></html>
